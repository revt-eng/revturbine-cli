name: PR gate

# Check level L1 (EP-1747) through the shared check-level workflow on our
# CodeBuild runners. This repository is public, so it calls the generated copy
# in .github/workflows/ci-level.yml (never edit it here; the devkit regenerates
# it), which owns the runner label and sends pull requests from forks to
# GitHub-hosted runners. Each job installs the npm pinned in package.json, then
# `npm ci`, and runs scripts/ci-l1.mjs:
#   verify            `npm run ci:l1`: workflow checks, line endings, typecheck,
#                     lint, schema consistency, every test, build.
#   package-smoke     `npm run ci:l1:smoke` on Node 22.13.0 and 24: the packed
#                     CLI installed in a clean consumer.
#   Release exhaustive  push to main only: requires both. Backlog reads
#                     "Release exhaustive / aggregate" as the release evidence.
#                     The name is a cross-repository contract (named
#                     "Iteration exhaustive" until 2026-11-16, which Backlog
#                     still accepts): rename it only together with Backlog.
# workflow_dispatch gates a branch's head by hand: `verify` and the smoke jobs,
# which do not depend on the event, with no pull request and no exhaustive job.
# Their check names end in " (on demand)": a merge gate that keeps the newest
# check run per name on a pull request's head would otherwise take a dispatched
# pass for that pull request's own run. Concurrency is the shared workflow's, per
# pull request number or else per ref, and only a pull request cancels. A
# dispatched run is not a push run, which is all publish-on-main.yml reads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'verify (on demand)' || 'verify' }}
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      node-version: '24'
      fetch-depth: 0
      install-command: |
        NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "npm@$NPM_VERSION"
        npm --version
        npm ci

  package-smoke:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Packed CLI smoke (Node {0}, on demand)', matrix.node) || format('Packed CLI smoke (Node {0})', matrix.node) }}
    # Proves the installed package validates configs with NO workspace siblings
    # present (scaffold/demo-data absent) at the supported floor and primary LTS.
    strategy:
      matrix:
        node: ['22.13.0', '24']
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      # Distinct per Node version: the shared workflow's concurrency group includes the name.
      name: smoke-node-${{ matrix.node }}
      node-version: ${{ matrix.node }}
      install-command: |
        NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "npm@$NPM_VERSION"
        npm --version
        npm ci
      command: npm run ci:l1:smoke

  release-exhaustive:
    name: Release exhaustive
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, package-smoke]
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      name: aggregate
      node-version: none
      package-manager: none
      command: test "${{ needs.verify.result }}" = success && test "${{ needs.package-smoke.result }}" = success
