name: PR gate

# Check level L1 (EP-1747) through the shared check-level workflow on our
# CodeBuild runners. This repository is public, so it calls the generated copy
# in .github/workflows/ci-level.yml (never edit it here; the devkit regenerates
# it), which owns the runner label and sends pull requests from forks to
# GitHub-hosted runners. Each job installs the npm pinned in package.json, then
# `npm ci`, and runs scripts/ci-l1.mjs:
#   verify            `npm run ci:l1`: selector checks, line endings, typecheck,
#                     lint, schema consistency, tests (targeted for iteration
#                     pull requests), build.
#   package-smoke     `npm run ci:l1:smoke` on Node 22.13.0 and 24: the packed
#                     CLI installed in a clean consumer.
#   Iteration exhaustive  push to main only: requires both. Backlog reads
#                     "Iteration exhaustive / aggregate" as the release evidence.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      node-version: '24'
      fetch-depth: 0
      install-command: |
        NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "npm@$NPM_VERSION"
        npm --version
        npm ci

  package-smoke:
    name: Packed CLI smoke (Node ${{ matrix.node }})
    # Proves the installed package validates configs with NO workspace siblings
    # present (scaffold/demo-data absent) at the supported floor and primary LTS.
    strategy:
      matrix:
        node: ['22.13.0', '24']
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      # Distinct per Node version: the shared workflow's concurrency group includes the name.
      name: smoke-node-${{ matrix.node }}
      node-version: ${{ matrix.node }}
      install-command: |
        NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "npm@$NPM_VERSION"
        npm --version
        npm ci
      command: npm run ci:l1:smoke

  iteration-exhaustive:
    name: Iteration exhaustive
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, package-smoke]
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      name: aggregate
      node-version: none
      package-manager: none
      command: test "${{ needs.verify.result }}" = success && test "${{ needs.package-smoke.result }}" = success
