name: Snapshot patch release

# A schema publish in revturbine-scaffold ends here with a CLI patch release and
# no human step (BUG-1189, ST-1453 TASK-5):
#
#   1. scaffold's release opens the `chore: vendor schema snapshot` PR (plan 143),
#      waits for this repo's gate on the exact head and squash-merges it;
#   2. that merge changes `src/schema/version.ts` on main — this workflow's trigger;
#   3. this workflow bumps the patch version and pushes it to main; that push
#      changes package.json, which starts `publish-on-main`, and it verifies,
#      publishes and tags.
#
# Push credential (EP-1747 phase 7): main takes changes only through a pull
# request ("Pull requests into main and staging"), except from the bypass Apps.
# The bump is pushed, and committed, as the push App (revturbine-ci-bot, app id
# vars.CI_PUSH_APP_ID), with a token narrowed to contents: write on this repository and minted only when a bump
# is due. The key is CI_PUSH_APP_PRIVATE_KEY in the ci-push environment, which
# only main may use. A
# push made with the App's token starts push-triggered workflows, so the
# existing publish path (provenance, registry-idempotent, tag record) runs on the
# bump commit with no dispatch. No PAT: this repo is public and the org
# REVTURBINE_GIT_TOKEN is withheld from public repos by design.
#
# Release decision, kept deliberately small:
#   - only a change to the bundled schema version releases (the path filter);
#   - if package.json's version is not on npm yet, a release is already pending
#     and publish-on-main owns it — nothing to bump;
#   - the bump commit touches package.json / package-lock.json only, so it can
#     not re-trigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'src/schema/version.ts'

permissions:
  contents: read # the checkout; the bump is pushed with the App's token

concurrency:
  group: snapshot-patch-release
  cancel-in-progress: false

jobs:
  bump-and-dispatch:
    runs-on: ubuntu-latest
    environment: ci-push
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use the npm version pinned in package.json
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
          # A released npm only, installed with no install scripts: this job later holds the push App's token.
          if [[ ! "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing packageManager npm@$NPM_VERSION: not a released npm version."
            exit 1
          fi
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - name: Decide whether a patch release is needed
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SCHEMA=$(node -p "require('fs').readFileSync('src/schema/version.ts','utf8').match(/'([0-9]+\.[0-9]+\.[0-9]+[^']*)'/)[1]")
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          if npm view "@revturbine/cli@$VERSION" version >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "@revturbine/cli@$VERSION is on npm; bundling schema $SCHEMA needs a patch release."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "@revturbine/cli@$VERSION is not on npm yet — a release is already pending; publish-on-main owns it."
          fi
      - name: Mint the push App token for the push
        if: steps.decide.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.CI_PUSH_APP_ID }}
          private-key: ${{ secrets.CI_PUSH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # The push App is revturbine-ci-bot, whose installation can do more than push
          # (actions, pull requests). This token gets contents: write on one repository only.
          permission-contents: write
      - name: Bump the patch version and push it to main
        if: steps.decide.outputs.release == 'true'
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env -u PUSH_TOKEN npm version patch --no-git-tag-version
          NEXT=$(node -p "require('./package.json').version")
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)+${bot}@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$NEXT (bundles schema ${{ steps.decide.outputs.schema }})"
          # The App token goes to git only, through a credential helper that reads it
          # from the environment; it is never written to the checkout.
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' \
            push origin HEAD:main
